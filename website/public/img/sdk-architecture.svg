<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1800" height="1160" fill="#FFFFFF"/>

  <!-- ================= title ================= -->
  <text x="40" y="46" font-size="31" font-weight="700" fill="#0F172A">Agent Fabric SDK &#8212; from your framework to the governed gateway</text>
  <text x="40" y="76" font-size="16.5" fill="#64748B">Your code stays native. The SDK injects governance into the transport. The Omni Gateway enforces policy before any model sees your prompt.</text>

  <!-- ================= arrows in the gaps ================= -->
  <g stroke="#475569" stroke-width="2.5" marker-end="url(#arrowDown)">
    <line x1="830" y1="254" x2="830" y2="286"/>
    <line x1="830" y1="574" x2="830" y2="606"/>
    <line x1="830" y1="702" x2="830" y2="734"/>
    <line x1="830" y1="970" x2="830" y2="1002"/>
  </g>
  <g stroke="#059669" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowUp)">
    <line x1="1030" y1="288" x2="1030" y2="256"/>
    <line x1="1030" y1="608" x2="1030" y2="576"/>
    <line x1="1030" y1="736" x2="1030" y2="704"/>
    <line x1="1030" y1="1004" x2="1030" y2="972"/>
  </g>
  <text x="846" y="277" font-size="12.5" fill="#475569">your call</text>
  <text x="1046" y="277" font-size="12.5" fill="#059669">response &#183; typed error</text>

  <!-- ================= 1 - YOUR CODE ================= -->
  <rect x="40" y="96" width="1720" height="150" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="127" font-size="13.5" font-weight="700" letter-spacing="1.4" fill="#64748B">1 &#183; YOUR CODE &#8212; UNCHANGED</text>

  <g>
    <rect x="64" y="146" width="169" height="76" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="148.5" y="177" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">LangGraph</text>
    <text x="148.5" y="199" font-size="10.5" fill="#64748B" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">ChatOpenAI</text>

    <rect x="251" y="146" width="169" height="76" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="335.5" y="177" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">Google ADK</text>
    <text x="335.5" y="199" font-size="10.5" fill="#64748B" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">LiteLlm</text>

    <rect x="438" y="146" width="169" height="76" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="522.5" y="177" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">Strands</text>
    <text x="522.5" y="199" font-size="10.5" fill="#64748B" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">OpenAIModel</text>

    <rect x="625" y="146" width="169" height="76" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="709.5" y="172" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">MS Agent</text>
    <text x="709.5" y="189" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">Framework</text>
    <text x="709.5" y="209" font-size="10.5" fill="#64748B" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">chat client</text>

    <rect x="812" y="146" width="169" height="76" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="896.5" y="172" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">OpenAI</text>
    <text x="896.5" y="189" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">Agents SDK</text>
    <text x="896.5" y="209" font-size="9" fill="#64748B" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">OpenAIChatCompletionsModel</text>

    <rect x="999" y="146" width="169" height="76" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="1083.5" y="177" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">Anthropic SDK</text>
    <text x="1083.5" y="199" font-size="10.5" fill="#64748B" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">AsyncAnthropic</text>

    <rect x="1186" y="146" width="169" height="76" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="1270.5" y="177" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">CrewAI</text>
    <text x="1270.5" y="199" font-size="10.5" fill="#64748B" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">LLM (LiteLLM)</text>

    <rect x="1373" y="146" width="169" height="76" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="1457.5" y="177" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">LlamaIndex</text>
    <text x="1457.5" y="199" font-size="10.5" fill="#64748B" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">OpenAILike</text>

    <rect x="1560" y="146" width="169" height="76" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="1644.5" y="170" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">No framework</text>
    <text x="1644.5" y="188" font-size="11.5" fill="#64748B" text-anchor="middle">plain OpenAI SDK</text>
    <text x="1644.5" y="208" font-size="10" fill="#64748B" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">AsyncOpenAI / OpenAI</text>
  </g>
  <text x="64" y="238" font-size="12" fill="#94A3B8">Deep, conformance-gated: LangGraph     |     Supported at connection_kwargs(): ADK &#183; Strands &#183; Agent Framework &#183; OpenAI Agents &#183; Anthropic &#183; CrewAI &#183; LlamaIndex</text>

  <!-- ================= 2 - SDK ================= -->
  <rect x="40" y="296" width="1720" height="270" rx="14" fill="#F0F7FF" stroke="#0176D3" stroke-width="2"/>
  <text x="64" y="327" font-size="13.5" font-weight="700" letter-spacing="1.4" fill="#0176D3">2 &#183; AGENT FABRIC SDK</text>
  <text x="399" y="327" font-size="12.5" fill="#64748B" font-family="ui-monospace, 'SF Mono', Menlo, monospace">pip install "agent-fabric[llm,langgraph]"</text>

  <!-- col 1 -->
  <rect x="64" y="344" width="536" height="138" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <circle cx="95" cy="366" r="11" fill="#0176D3"/>
  <text x="95" y="371" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="116" y="371" font-size="14.5" font-weight="700" fill="#0176D3">Resolve config</text>
  <text x="84" y="398" font-size="12.5" fill="#0F172A" font-family="ui-monospace, 'SF Mono', Menlo, monospace">Fabric.from_env()</text>
  <text x="84" y="418" font-size="11.5" fill="#475569" font-family="ui-monospace, 'SF Mono', Menlo, monospace">AGENT_FABRIC_LLM_PROXY_URL</text>
  <text x="84" y="436" font-size="11.5" fill="#475569" font-family="ui-monospace, 'SF Mono', Menlo, monospace">AGENT_FABRIC_LLM_PROXY_CLIENT_ID / _CLIENT_SECRET</text>
  <text x="84" y="462" font-size="11.5" fill="#64748B">kwargs &#8594; env &#8594; .agent-fabric.toml. Every missing</text>
  <text x="84" y="476" font-size="11.5" fill="#64748B">value is reported at once, not one per run.</text>

  <!-- col 2 -->
  <rect x="632" y="344" width="536" height="138" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <circle cx="663" cy="366" r="11" fill="#0176D3"/>
  <text x="663" y="371" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="684" y="371" font-size="14.5" font-weight="700" fill="#0176D3">Build the native object</text>
  <text x="652" y="398" font-size="12" fill="#0F172A" font-family="ui-monospace, 'SF Mono', Menlo, monospace">fabric.langgraph.chat_model("gpt-4o")</text>
  <text x="652" y="419" font-size="12" fill="#059669" font-family="ui-monospace, 'SF Mono', Menlo, monospace">&#8594; a real langchain_openai.ChatOpenAI</text>
  <text x="652" y="441" font-size="11.5" font-weight="700" fill="#0F172A">The one design rule: never a wrapper.</text>
  <text x="652" y="462" font-size="11.5" fill="#64748B">connection_kwargs() prints the exact constructor</text>
  <text x="652" y="476" font-size="11.5" fill="#64748B">args &#8212; your three-line escape hatch out of the SDK.</text>

  <!-- col 3 -->
  <rect x="1200" y="344" width="536" height="138" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <circle cx="1231" cy="366" r="11" fill="#0176D3"/>
  <text x="1231" y="371" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="1252" y="371" font-size="14.5" font-weight="700" fill="#0176D3">Govern the transport</text>
  <text x="1220" y="398" font-size="12" fill="#0F172A" font-family="ui-monospace, 'SF Mono', Menlo, monospace">FabricAsyncClient &#183; FabricClient (sync)</text>
  <text x="1220" y="420" font-size="11.5" fill="#475569">One shared httpx client, handed to every adapter.</text>
  <text x="1220" y="438" font-size="11.5" fill="#475569">Injects headers on every outbound request.</text>
  <text x="1220" y="462" font-size="11.5" fill="#64748B">Retries 429 / 502 / 503 / 504 with backoff + jitter.</text>
  <text x="1220" y="476" font-size="11.5" fill="#64748B">Policy rejections are terminal &#8212; never retried.</text>

  <!-- error strip -->
  <rect x="64" y="494" width="1672" height="58" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <circle cx="95" cy="515" r="11" fill="#0176D3"/>
  <text x="95" y="520" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="116" y="519" font-size="14.5" font-weight="700" fill="#0176D3">classify(response)</text>
  <text x="116" y="538" font-size="11.5" fill="#64748B">Branch on outcomes, not error bodies.</text>

  <rect x="440" y="507" width="170" height="32" rx="7" fill="#FEF3C7" stroke="#FCD34D"/>
  <text x="525" y="528" font-size="12.5" font-weight="600" fill="#B45309" text-anchor="middle">401 &#183; AuthError</text>

  <rect x="628" y="507" width="180" height="32" rx="7" fill="#FEE2E2" stroke="#FCA5A5"/>
  <text x="718" y="528" font-size="12.5" font-weight="600" fill="#B91C1C" text-anchor="middle">403 &#183; PIIDetected</text>

  <rect x="826" y="507" width="252" height="32" rx="7" fill="#FFEDD5" stroke="#FDBA74"/>
  <text x="952" y="528" font-size="12.5" font-weight="600" fill="#C2410C" text-anchor="middle">429 &#183; TokenBudgetExceeded</text>

  <rect x="1096" y="507" width="290" height="32" rx="7" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="1241" y="528" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">passthrough &#183; UpstreamRequestError</text>

  <text x="1404" y="528" font-size="11.5" fill="#94A3B8">all subclass FabricError</text>

  <!-- ================= 3 - THE WIRE ================= -->
  <rect x="40" y="616" width="1720" height="78" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="880" y1="632" x2="880" y2="678" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="64" y="645" font-size="13" font-weight="700" letter-spacing="1.2" fill="#64748B">3 &#183; ONE OPENAI-COMPATIBLE HTTPS CALL &#8212; NO SDK REQUIRED</text>
  <text x="64" y="676" font-size="13.5" fill="#0F172A" font-family="ui-monospace, 'SF Mono', Menlo, monospace">POST https://&lt;ingress&gt;/&lt;instance&gt;/chat/completions</text>
  <text x="530" y="676" font-size="12" font-weight="600" fill="#DC2626" font-family="ui-monospace, 'SF Mono', Menlo, monospace">&#8592; note: no /v1</text>

  <text x="910" y="645" font-size="13" font-weight="700" letter-spacing="1.2" fill="#64748B">HEADERS INJECTED FOR YOU</text>
  <rect x="910" y="657" width="124" height="30" rx="7" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="972" y="677" font-size="11.5" fill="#047857" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">client_id</text>
  <rect x="1050" y="657" width="152" height="30" rx="7" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="1126" y="677" font-size="11.5" fill="#047857" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">client_secret</text>
  <rect x="1218" y="657" width="178" height="30" rx="7" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="1307" y="677" font-size="11.5" fill="#047857" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">X-Correlation-Id</text>
  <rect x="1412" y="657" width="240" height="30" rx="7" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="1532" y="677" font-size="11.5" fill="#047857" text-anchor="middle">attribution &#183; app / business group</text>

  <!-- ================= 4 - OMNI GATEWAY ================= -->
  <rect x="40" y="744" width="1720" height="218" rx="14" fill="#E8F6FD" stroke="#00A1E0" stroke-width="2.5"/>
  <text x="64" y="778" font-size="16" font-weight="700" letter-spacing="0.6" fill="#075985">4 &#183; OMNI GATEWAY &#8212; LLM PROXY</text>
  <text x="560" y="778" font-size="13" fill="#0369A1">governed data plane &#183; live-verified</text>
  <text x="64" y="800" font-size="12.5" fill="#0C4A6E">Policies are configured once by your platform team in Anypoint. None of this lives in your application code.</text>

  <rect x="64" y="814" width="406" height="88" rx="10" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5"/>
  <text x="86" y="842" font-size="14.5" font-weight="700" fill="#0F172A">Consumer auth</text>
  <text x="86" y="864" font-size="11.5" fill="#475569">client_id + client_secret pair enforced</text>
  <text x="86" y="887" font-size="11.5" font-weight="600" fill="#B45309" font-family="ui-monospace, 'SF Mono', Menlo, monospace">reject &#8594; 401</text>

  <rect x="486" y="814" width="406" height="88" rx="10" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5"/>
  <text x="508" y="842" font-size="14.5" font-weight="700" fill="#0F172A">PII detection</text>
  <text x="508" y="864" font-size="11.5" fill="#475569">prompt scanned before it ever leaves</text>
  <text x="508" y="887" font-size="11.5" font-weight="600" fill="#B91C1C" font-family="ui-monospace, 'SF Mono', Menlo, monospace">reject &#8594; 403</text>

  <rect x="908" y="814" width="406" height="88" rx="10" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5"/>
  <text x="930" y="842" font-size="14.5" font-weight="700" fill="#0F172A">Token budget</text>
  <text x="930" y="864" font-size="11.5" fill="#475569">per-consumer spend ceiling</text>
  <text x="930" y="887" font-size="11.5" font-weight="600" fill="#C2410C" font-family="ui-monospace, 'SF Mono', Menlo, monospace">reject &#8594; 429 (+ Retry-After)</text>

  <rect x="1330" y="814" width="406" height="88" rx="10" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5"/>
  <text x="1352" y="842" font-size="14.5" font-weight="700" fill="#0F172A">Metering &amp; attribution</text>
  <text x="1352" y="864" font-size="11.5" fill="#475569">usage tagged per app / business group</text>
  <text x="1352" y="887" font-size="11.5" font-weight="600" fill="#047857" font-family="ui-monospace, 'SF Mono', Menlo, monospace">&#8594; Anypoint dashboards</text>

  <text x="64" y="936" font-size="12.5" fill="#0C4A6E">The same Anypoint API management plane already governing your REST APIs &#8212; one policy engine, one audit trail, one team that already runs it.</text>

  <!-- ================= 5 - PROVIDERS ================= -->
  <rect x="40" y="1012" width="1720" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="1041" font-size="13" font-weight="700" letter-spacing="1.4" fill="#64748B">5 &#183; UPSTREAM MODEL PROVIDERS</text>

  <rect x="64" y="1052" width="320" height="44" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="224" y="1080" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">OpenAI</text>
  <rect x="402" y="1052" width="320" height="44" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="562" y="1080" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Anthropic</text>
  <rect x="740" y="1052" width="320" height="44" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="900" y="1080" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Google</text>
  <rect x="1078" y="1052" width="320" height="44" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="1238" y="1080" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Azure OpenAI</text>
  <rect x="1416" y="1052" width="320" height="44" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="1576" y="1080" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Amazon Bedrock</text>

  <!-- ================= footer ================= -->
  <text x="40" y="1143" font-size="12.5" fill="#94A3B8">Live-verified today: governed model access. Phase 1 adds budget, simulator, conformance and telemetry on these same hooks; Phase 2 adds governed tool access (MCP) and A2A &#8212; where an API is unverified the SDK raises NotImplementedError rather than guess.</text>
</svg>
